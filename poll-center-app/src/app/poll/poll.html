<h2>Available Polls</h2>
<div>
  <div *ngFor="let poll of polls()" class="">
    <h3>{{poll.question}}</h3>
    <div>
      <div *ngFor="let optionVotes of poll.optionVotes; let i = index">
        <button class="">
          {{optionVotes.option}}({{optionVotes.vote}} votes)
        </button>
      </div>
    </div>
  </div>
</div>
