<div class="container mt-4">
  <h2 class="text-center">Create Poll</h2>
  <div class="mb-3">
    <input
      [(ngModel)]="newPoll.question"
      placeholder="Poll Question"
      class="form-control"
      required
    />
  </div>
  <h2 class="mt-4 text-center">Available Polls</h2>
  <div class="polls-list">
    <div *ngFor="let poll of polls()" class="border rounded p-3 mb-3">
      <h3>{{ poll.question }}</h3>
      <div class="option-list">
        <div *ngFor="let optionVotes of poll.optionVotes; let i = index">
          <button class="btn btn-outline-primary me-2 mt-2">
            {{ optionVotes.option }}({{ optionVotes.vote }} votes)
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
